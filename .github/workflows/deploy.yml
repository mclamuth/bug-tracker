# Builds one release and deploys it: to Test on every merge to main, and to Production when someone runs this
# workflow and chooses "production" (the production environment requires an approval in GitHub).
#
# Nothing deploys until the repository variable DEPLOY_ENABLED is set to "true", once IT's setup is done and
# the GitHub environments are configured (docs/go-live.md).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [test, production]
        default: test

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build the release
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build the React app
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Publish the API with the React app in wwwroot
        run: |
          dotnet tool restore
          dotnet publish src/BugTracker.Api --configuration Release --output release/app
          mkdir -p release/app/wwwroot
          cp -r web/dist/. release/app/wwwroot/

      - name: Bundle the database migrations
        run: >
          dotnet ef migrations bundle --configuration Release
          --project src/BugTracker.Infrastructure --startup-project src/BugTracker.Api
          --self-contained --target-runtime linux-x64 --output release/efbundle

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release
          retention-days: 30

  test:
    needs: build
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: test
      parameters: infra/test.bicepparam

  production:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: production
      parameters: infra/prod.bicepparam
