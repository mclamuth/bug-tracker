name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  api:
    name: API (.NET)
    runs-on: ubuntu-latest
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci#Only-Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci#Only-Passw0rd' -Q 'SELECT 1' -b"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          dotnet restore
          dotnet tool restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "trx" --results-directory TestResults

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Apply migrations to a real SQL Server
        # Proves the migrations (sequence, rowversion, check constraint, seed data) work on SQL Server, not just SQLite.
        run: >
          dotnet ef database update
          --project src/BugTracker.Infrastructure --startup-project src/BugTracker.Api
          --configuration Release --no-build
          --connection "Server=localhost,1433;Database=BugTrackerCi;User Id=sa;Password=Ci#Only-Passw0rd;TrustServerCertificate=True"

      - name: Script migrations
        run: >
          dotnet ef migrations script --idempotent
          --project src/BugTracker.Infrastructure --startup-project src/BugTracker.Api
          --configuration Release --no-build --output artifacts/migrations.sql

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-results
          path: |
            TestResults
            artifacts/migrations.sql

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
